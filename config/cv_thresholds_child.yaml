# CV 이벤트 판정 임계값 — 아동(subject_type=child) 프로파일
#
# 이 파일은 cv_thresholds_adult.yaml과 완전히 독립된 별도 파일이다 — 성인 값이 아동 값의
# 초기값이 되거나 영향을 주지 않는다 (계획 "설정 프로파일 분리" 섹션 참고).
# 아동 실측 영상이 아직 없어 지금은 빈 틀이다. 마일스톤 B(실제 아동 영상)에서 채울 것.
#
# TODO(문제점.md 6번, 미해결): 3~8세를 한 구간으로 뭉뚱그린 상태 — 나이 구간별(예:
# 3~4세/5~6세/7~8세) 세분화가 이상적이지만, 실측 데이터 없이는 구간별 값을 채울 근거가 없다.

posture:
  torso_tilt_avoidance_deg: null   # TODO
  sudden_movement_threshold: null  # TODO

facial_au:
  # subject_type=child일 때 facial_expression.py가 PyAFAR(Infant AFAR)로 전환 — 단,
  # OpenFace와 AU 세트/스케일이 다를 수 있음 (문제점.md 5번, 미해결 — 어댑터 계층 필요).
  intensity_thresholds: {}
  low_confidence_flag:
    enabled: true
    note: "handoff_timestamp_s 이후 구간에서 특히 주의 깊게 확인할 것 (계획 '표정 분석' 섹션)"

doll_tracking:
  proximity_seeking_distance_px: null  # TODO
  throw_movement_threshold: null       # TODO
  tracking_lost_min_frames: null       # TODO

voice_prosody:
  normalization: "within_session_relative_zscore"
  baseline_segment: "warm_up"
  zscore_notable_threshold: null  # TODO
