# 인형/소품 클래스 정의 — YOLO(v8/11) 파인튜닝 라벨 스키마 (object_tracking.py)
# 매 세션 동일한 물리적 인형 세트를 재사용한다는 전제로, 정해진 클래스만 탐지하는 닫힌 문제로 설계.
# 실제 사용할 물리적 인형 세트가 확정되면 class_id/색상 등 세부사항을 맞춰 갱신할 것 (마일스톤 0).

classes:
  - id: mother_doll
    display_name_ko: "엄마인형"
  - id: father_doll
    display_name_ko: "아빠인형"
  - id: child_doll
    display_name_ko: "주인공인형(아동 역)"
  - id: sibling_doll
    display_name_ko: "동생인형"
  - id: grandmother_doll
    display_name_ko: "할머니인형"
  - id: dog_doll
    display_name_ko: "강아지인형"
    name_hint: "뽀삐"  # story_stems.yaml lost_dog stem의 doll_name_hint와 일치
  - id: friend_doll
    display_name_ko: "친구인형"
  - id: shopkeeper_doll
    display_name_ko: "가게주인인형"
  - id: car
    display_name_ko: "자동차 (소품)"
    note: "reunion(재결합) 스템에서 아동과의 거리 궤적이 중요 — 간이대본 지시 참고"
  - id: pot
    display_name_ko: "냄비 (소품)"
    note: "hot_gravy(뜨거운 냄비) 스템에서 근접 행동 추적 대상"

# 형제 인형(외형 동일) 재식별 — 순수 시각 추적이 아니라 발화 내용과 결합해 재식별.
# 상세 설계는 계획 문서 "인형/소품 추적" 섹션 참고.
reidentification_note: >
  겹침 자체를 막지는 못함. 아이가 "형이가~" 같이 특정 인형을 지목하는 순간마다
  (a) 그 시점 아이 손과 가장 가까운 트랙 ID, (b) 전사문에서 언급된 인물 이름을 함께 보고
  ID-이름 매핑을 재확정.

tracking_lost_flag:
  enabled: true
  note: >
    경계상자가 일정 프레임 수 이상 연속으로 끊기면 tracking_lost: true 플래그와 구간을 남긴다.
    (문제점.md 옛 9번 — 완화 반영됨, 완전 해결 아님)
