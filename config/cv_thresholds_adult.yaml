# CV 이벤트 판정 임계값 — 성인(subject_type=adult) 프로파일
#
# 성인 대역 영상은 파이프라인 배선 검증용일 뿐이라 이 값으로 기준을 확정하지 않는다.
# 구조와 기본값은 cv_thresholds_child.yaml과 같이 두어 같은 코드 경로가 돌게 한다 —
# 각 값의 근거 등급([A]/[B]/[C])과 설명은 아동 파일의 주석을 참고할 것.
# 성인 값이 아동 값에 영향을 주지는 않는다 (두 파일은 독립).

posture:
  landmark_visibility_min: 0.5
  max_missing_ratio: 0.20
  baseline_min_frames: 10
  noise_floor_torso_ratio: 0.10
  sudden_movement_min_torso_ratio: 0.15
  sudden_movement_zscore: 2.0
  torso_tilt_min_delta_deg: 10.0
  torso_tilt_zscore: 2.0
  min_consecutive_frames: 2

facial_au:
  presence_probability_min: 0.5
  min_consecutive_frames: 2
  reliable_aus: ["AU06", "AU12", "AU25", "AU26"]
  reference_aus: ["AU01", "AU04", "AU07", "AU14"]
  head_pose_caution_deg: 20.0
  head_pose_exclude_deg: 35.0
  landmark_confidence_min: 0.5
  max_low_confidence_ratio: 0.50
  intensity_thresholds: {}

doll_tracking:
  detection_conf_min: 0.25
  class_min_seen_frames: 2
  tracking_lost_min_frames: 3
  proximity_center_distance_width_ratio: 1.5
  proximity_min_consecutive_frames: 2
  sudden_movement_diag_ratio: 0.25

voice_prosody:
  normalization: "within_session_relative_zscore"
  baseline_segment: "warm_up"
  pitch_valid_min_hz: 150.0
  pitch_valid_max_hz: 500.0
  baseline_min_voiced_frames: 300
  window_s: 1.0
  window_min_voiced_ratio: 0.3
  zscore_notable_threshold: 2.0
